<nav class="p-3" aria-label="Workspace navigation">

  <!-- Sidebar heading -->

         px-3 text-xs font-semibold uppercase

    <span>Workspace</span>

  <ul class="space-y-2 pt-1">

    @for (item of menuItems; track item.route) {

    <li>

      <a [routerLink]="item.route" routerLinkActive="menu-active" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page" [pTooltip]="collapsed ? item.label : ''" tooltipPosition="right"
        [tooltipDisabled]="!collapsed" [showDelay]="200" [attr.aria-label]="item.label" (click)="menuSelected.emit()"
        class="menu-link" [class.menu-link-collapsed]="collapsed">
        <i [class]="item.icon" aria-hidden="true"></i>

        <span class="menu-label" [class.menu-label-collapsed]="collapsed">
          {{ item.label }}
        </span>
      </a>

    </li>

    }

  </ul>

</nav>
<div class="sidebar-art" aria-hidden="true">
  <div class="art-wave wave-one"></div>
  <div class="art-wave wave-two"></div>
  <div class="art-wave wave-three"></div>
</div>
