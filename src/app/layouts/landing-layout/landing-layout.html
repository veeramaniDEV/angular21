<div class="min-h-dvh bg-slate-50">

  <!-- Topbar -->
  <app-topbar [menuOpen]="sidebarOpen()" (menuToggle)="toggleSidebar()" />

  <!-- Mobile background overlay -->
  @if (sidebarOpen()) {
  <button type="button" aria-label="Close navigation menu" (click)="closeSidebar()" class="fixed inset-x-0 bottom-0 top-16
             z-30 bg-slate-900/30 lg:hidden"></button>
  }

  <!-- Sidebar -->
  <aside id="main-sidebar" aria-label="Main navigation" class="sidebar" [class.sidebar-open]="sidebarOpen()"
    [class.sidebar-collapsed]="sidebarCollapsed()">
    <app-sidebar [collapsed]="sidebarCollapsed()" (menuSelected)="closeSidebar()" />
  </aside>

  <!-- Main content -->
  <div class="content-wrapper flex min-h-dvh flex-col
           pt-16" [class.content-expanded]="sidebarCollapsed()">
    <main id="main-content" class="min-w-0 flex-1 px-2 py-4 sm:px-3">
      <router-outlet />
    </main>

    <app-footer />
  </div>

</div>
