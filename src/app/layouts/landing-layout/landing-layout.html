<div class="min-h-dvh bg-slate-50">

  <!-- Topbar -->
  <app-topbar [menuOpen]="sidebarOpen() || !sidebarCollapsed()" (menuToggle)="toggleSidebar()" />

  <!-- Mobile backdrop -->
  @if (sidebarOpen()) {
  <button type="button" aria-label="Close navigation menu" (click)="closeSidebar()" class="fixed inset-0 top-16 z-30
             bg-slate-900/30 lg:hidden"></button>
  }

  <!-- Sidebar -->
  <aside id="main-sidebar" aria-label="Main navigation" class="sidebar" [class.sidebar-open]="sidebarOpen()"
    [class.sidebar-collapsed]="sidebarCollapsed()">
    <app-sidebar (menuSelected)="closeSidebar()" />
  </aside>

  <!-- Main content -->
  <div class="flex min-h-dvh flex-col pt-16 transition-all duration-300 ease-in-out"
    [class.content-normal]="!sidebarCollapsed()" [class.content-expanded]="sidebarCollapsed()">
    <main id="main-content" class="min-w-0 flex-1 px-2 py-4 sm:px-3">
      <router-outlet />
    </main>

    <app-footer />
  </div>

</div>
